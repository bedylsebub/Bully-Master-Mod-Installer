name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the EXE to (e.g. v1.0.0); leave blank for build only'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'BullyModPatcher.py'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'
      - 'README.md'
      - 'bully_font_asset.py'
      - 'duck_asset.py'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile BullyModPatcher.py
      - name: Install packaging dependencies
        run: python -m pip install "pyinstaller>=6,<7" "Pillow>=10,<13"
      - name: Fetch Inter font from Google Fonts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" -OutFile "assets/Inter.ttf"
          if ((Get-Item "assets/Inter.ttf").Length -lt 10000) { throw "Inter font download failed" }
      - name: Create Windows icon from duck artwork
        shell: pwsh
        run: |
          @'
          from io import BytesIO
          from PIL import Image
          from duck_asset import DUCK_PNG
          image = Image.open(BytesIO(DUCK_PNG)).convert("RGBA")
          image.save("assets/duck.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 create_icon.py
          python create_icon.py
      - name: Build portable Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BullyModPatcher --icon "assets/duck.ico" --add-data "assets/Inter.ttf;assets" BullyModPatcher.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bully-MasterMod-Easy-Installer-Windows
          path: dist/BullyModPatcher.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } elseif ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
          if (-not $tag) { throw "No release tag specified." }
          gh release view "$tag" --repo "$env:REPO" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --repo "$env:REPO" --title "Bully MasterMod Easy Installer $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          gh release upload "$tag" "dist/BullyModPatcher.exe" --repo "$env:REPO" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload executable to release $tag" }
