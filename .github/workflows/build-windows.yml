name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BullyModPatcher.py'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile BullyModPatcher.py
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build portable Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BullyModPatcher BullyModPatcher.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Bully-MasterMod-Easy-Installer-Windows
          path: dist/BullyModPatcher.exe
          if-no-files-found: error
