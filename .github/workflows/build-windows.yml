name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the EXE to (e.g. v1.0.0); leave blank for build only'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'BullyModPatcher.py'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'
      - 'README.md'\n      - 'bully_font_asset.py'\n      - 'duck_asset.py'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile BullyModPatcher.py
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build portable Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BullyModPatcher BullyModPatcher.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bully-MasterMod-Easy-Installer-Windows
          path: dist/BullyModPatcher.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } elseif ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
          if (-not $tag) { throw "No release tag specified." }
          gh release view "$tag" --repo "$env:REPO" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --repo "$env:REPO" --title "Bully MasterMod Easy Installer $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          gh release upload "$tag" "dist/BullyModPatcher.exe" --repo "$env:REPO" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload executable to release $tag" }
